services:
  mysql:
    image: mysql:8.0
    container_name: launchops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: launchops
      MYSQL_USER: launchops
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  python-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchops-python-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      MOCK_MODE: ${MOCK_MODE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
    restart: unless-stopped

  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
      args:
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
        VITE_APP_ID: ${VITE_APP_ID:-}
        VITE_AUTH_DISABLED: ${VITE_AUTH_DISABLED:-false}
    container_name: launchops-platform
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_BYPASS_ENABLED: ${AUTH_BYPASS_ENABLED:-false}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:?Set OWNER_OPEN_ID in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-https://api.openai.com}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      FOUNDER_EDITION_DIR: /opt/launchops
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      python-backend:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ${FOUNDER_EDITION_DIR:-.}/agents:/opt/launchops/agents:ro

  caddy:
    image: caddy:2-alpine
    container_name: launchops-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - platform
      - python-backend

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
